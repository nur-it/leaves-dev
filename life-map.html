    const mapEventData = {
        m2: {
            title: "Family Home",
            desc: "Moved into the first family home.",
            purpose: "Home",
            date: "Sunday, May 3, 1981",
            place: "Oakwood Residence",
            address: "Springfield, IL, United States",
            image: "https://images.unsplash.com/photo-1560185127-4a4b3679fe22?w=1200&q=80&auto=format&fit=crop"

        m3: {
            title: "Rachel’s Graduation Ceremony",
            desc: "Emma's graduation ceremony held at Madison High School.",
            purpose: "Graduation",
            date: "Sunday, May 22, 2016",
            place: "University of Central Florida",
            address: "JQ2X+XX Orlando, Florida, USA",
            image: "https://images.unsplash.com/photo-1507679799987-c73779587ccf?w=1200&q=80&auto=format&fit=crop"
        },
        m5: {
            title: "First Job",
            desc: "Started career as a junior analyst.",
            purpose: "Career",
            date: "Monday, March 4, 1990",
            place: "Brighton Corp",
            address: "Chicago, IL, United States",
            image: "https://images.unsplash.com/photo-1521737604893-d14cc237f11d?w=1200&q=80&auto=format&fit=crop"
        }
    };

    const mapPopover = document.getElementById('map-popover');
    const imgEl = document.getElementById('map-popover-image');
    const titleEl = document.getElementById('map-popover-title');
    const descEl = document.getElementById('map-popover-desc');
    const purposeEl = document.getElementById('map-popover-purpose');
    const dateEl = document.getElementById('map-popover-date');
    const placeEl = document.getElementById('map-popover-place');
    const addressEl = document.getElementById('map-popover-address');
    const closeBtn = document.getElementById('map-popover-close');
    const storiesBtn = document.getElementById('map-popover-stories');
    const timelineBtn = document.getElementById('map-popover-timeline');

    function showMapPopover(data) {
        const d = data || {
            title: "Life Event",
            desc: "Details about this place.",
            purpose: "Event",
            date: "—",
            place: "—",
            address: "—",
            image: "https://images.unsplash.com/photo-1519689680058-324335c77eba?w=1200&q=80&auto=format&fit=crop"
        };
        imgEl.src = d.image;
        titleEl.textContent = d.title;
        descEl.textContent = d.desc;
        purposeEl.textContent = d.purpose;
        dateEl.textContent = d.date;
        placeEl.textContent = d.place;
        addressEl.textContent = d.address;
        mapPopover.classList.remove('hidden');
    }

    function hideMapPopover() {
        mapPopover.classList.add('hidden');
    }

    document.querySelectorAll('.map-pin').forEach(el => {
        el.addEventListener('click', () => {
            const id = el.getAttribute('data-map-id');
            const data = mapEventData[id];
            showMapPopover(data);
        });
    });

    closeBtn.addEventListener('click', hideMapPopover);
    mapPopover.addEventListener('click', e => { if (e.target === mapPopover) hideMapPopover(); });
    storiesBtn.addEventListener('click', () => { window.location.href = 'media-library.html'; });
    timelineBtn.addEventListener('click', () => { window.location.href = 'life-timeline.html'; });
</script>
